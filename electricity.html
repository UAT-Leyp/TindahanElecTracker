<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARAGON Tenant Electricity Tracker</title>
<style>
body{margin:0;background:#071F44;color:#fff;font-family:Arial,sans-serif;padding:15px}
h1{color:#c4b5fd}
.card{background:#2A144A;border:1px solid #8B5CF6;border-radius:16px;padding:15px;margin-top:15px}
.controls,.actions{display:flex;gap:10px;flex-wrap:wrap}
button{background:#8B5CF6;color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
input,select{width:100%;box-sizing:border-box;padding:8px;border:none;border-radius:8px;background:#12091F;color:#fff}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
 th:nth-child(1), td:nth-child(1){ width:20%; } /* Tenant */
th:nth-child(2), td:nth-child(2){ width:8%; }  /* Previous */
th:nth-child(3), td:nth-child(3){ width:8%; }  /* Current */
th:nth-child(4), td:nth-child(4){ width:6%; }  /* Consumed */
th:nth-child(5), td:nth-child(5){ width:10%; } /* Price */
th:nth-child(6), td:nth-child(6){ width:8%; }  /* Total */
th:nth-child(7), td:nth-child(7){ width:10%; } /* Status */
th:nth-child(8), td:nth-child(8){ width:15%; } /* Proof */
th:nth-child(9), td:nth-child(9){ width:7%; }  /* Delete */
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.15)}
th{background:#321a57}
.paid{background:#16a34a}.unpaid{background:#dc2626}
.summary{display:flex;gap:10px;flex-wrap:wrap}

 .box{
  background:#223b63;
  padding:12px;
  border-radius:10px;
  min-width:180px;
}
.kwh-input{
  width:80px;
  margin:auto;
  display:block;
}

.price{
  width:100px;
  margin:auto;
  display:block;
}

th{
  background:#321a57;
  text-align:center;
}

td{
  text-align:center;
}

td:first-child{
  text-align:left;
}


.proof-cell{
  text-align:center;
}
 
@media(max-width:768px){
 .controls,.actions{flex-direction:column}
 table{font-size:12px}
}
</style>
</head>
<body>
<a href="/" aria-label="Back to app selection" style="position:fixed;top:12px;right:12px;z-index:9999;background:#8B5CF6;color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px;font:600 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">← Home</a>

<h1>ARAGON Tenant Electricity Tracker</h1>

<div class="controls">
<button onclick="prevMonth()">◀ Prev</button>
<select id="monthSelect"></select>
<button onclick="nextMonth()">Next ▶</button>
</div>

<div class="actions" style="margin-top:10px">
<button onclick="addTenant()">Add Tenant</button>
<button onclick="openCopyMonthModal()">📋 Copy From Month</button>
<button onclick="saveMonth()">Save Data</button>
<button onclick="exportBackup()">Export Backup</button>

<input
  type="text"
  id="tenantSearch"
  placeholder="Search tenant..."
  oninput="filterTenants()"
  style="max-width:250px"
>

</div>

<div class="card">
<h2>Electricity Tracker</h2>
<table>
<thead>
<tr>
<th>Tenant</th><th>Previous kWh</th><th>Current kWh</th><th>Consumed</th>
<th>Price/kWh</th><th>Total Bill</th><th>Status</th><th>Proof/Notes</th><th>Action</th>
</tr>
</thead>
<tbody id="tenantBody"></tbody>
</table>
</div>




<script>
const KEY='tenant_tracker_v5';
let db={months:{}};

function saveCurrentMonth(){
 localStorage.setItem(
   'last_selected_month',
   monthSelect.value
 );
}
 
function months(){
 let arr=[];

 // March 2026
 let d = new Date(2026,2,1);

 // December 2030
 let e = new Date(2030,11,1);

 while(d<=e){
   arr.push(
     d.toLocaleString(
       'en-US',
       {month:'long',year:'numeric'}
     )
   );
   d.setMonth(d.getMonth()+1);
 }

 return arr;
}
function initMonths(){

 const monthList = months();

 monthList.forEach(
   m => monthSelect.add(new Option(m,m))
 );

monthSelect.onchange = async () => {

   await saveMonth();

   await loadMonth();

   await saveCurrentMonthToSupabase();
};
}

function currentMonth(){return monthSelect.value;}
 async function saveCurrentMonthToSupabase(){

  const { error } =
  await supabaseClient
    .from('elec_app_settings')
    .upsert({
      setting_key:'current_month',
      setting_value:monthSelect.value
    });

  if(error){
    console.error(error);
  }
}

async function loadCurrentMonthFromSupabase(){

  const { data, error } =
  await supabaseClient
    .from('elec_app_settings')
    .select('setting_value')
    .eq('setting_key','current_month')
    .single();

  if(error){
    console.error(error);
    return null;
  }

  return data.setting_value;
}
function prevLabel(m){let list=months(),i=list.indexOf(m);return i>0?list[i-1]:null;}

function ensureMonth(m){
 if(db.months[m]) return;

 const p = prevLabel(m);

 // Always carry the same tenants forward from the previous month.
 // Previous month's CURRENT kWh becomes the new month's PREVIOUS kWh.
 // Current kWh, payment status, and proof start fresh for the new month.
 if(p && db.months[p]){
   db.months[m] = {
     tenants: db.months[p].tenants.map(t => ({
       id: t.id,
       name: t.name,
       previous: t.current || 0,
       current: '',
       price: t.price ?? '',
       status: 'Unpaid',
       proof_url: ''
     }))
   };
 }else{
   db.months[m] = { tenants: [] };
 }

 saveDB();
}

function escapeHtml(value){
 return String(value ?? '')
   .replaceAll('&','&amp;')
   .replaceAll('<','&lt;')
   .replaceAll('>','&gt;')
   .replaceAll('\"','&quot;')
   .replaceAll("'",'&#039;');
}

function closeCopyMonthModal(){
 const modal = document.getElementById('copyMonthModal');
 if(modal) modal.remove();
}

function getCopySourceMonths(){
 return months().filter(month => month !== currentMonth());
}

async function getElecMonthRows(month){
 const { data, error } = await supabaseClient
   .from('elec_tenant_bills')
   .select('*')
   .eq('month', month)
   .order('display_order');

 if(error){
   console.error(error);
   alert('Could not load ' + month + '.');
   return null;
 }

 return data || [];
}

function openCopyMonthModal(){
 const sourceMonths = getCopySourceMonths();

 const overlay = document.createElement('div');
 overlay.id = 'copyMonthModal';
 overlay.style.cssText = `
   position:fixed;
   inset:0;
   background:rgba(0,0,0,.78);
   z-index:10000;
   display:flex;
   align-items:center;
   justify-content:center;
   padding:20px;
   overflow:auto;
 `;

 overlay.innerHTML = `
   <div style="background:#17122a;border:1px solid rgba(255,255,255,.18);border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);color:white">
     <h2 style="margin-top:0;color:#c4b5fd">📋 COPY FROM MONTH</h2>
     <div id="copyStep1">
       <p style="opacity:.85">Select the month you want to copy tenants from.</p>
       <select id="copySourceMonth" style="width:100%;padding:12px;border-radius:10px;font-size:16px;margin-bottom:20px">
         ${sourceMonths.map(month => `<option value="${escapeHtml(month)}">${escapeHtml(month)}</option>`).join('')}
       </select>
       <div style="display:flex;gap:10px;justify-content:flex-end">
         <button onclick="closeCopyMonthModal()" style="background:#dc2626">CANCEL</button>
         <button onclick="loadCopyChoices()">NEXT</button>
       </div>
     </div>
     <div id="copyStep2" style="display:none"></div>
   </div>
 `;

 overlay.addEventListener('click', event => {
   if(event.target === overlay) closeCopyMonthModal();
 });

 document.body.appendChild(overlay);
}

async function loadCopyChoices(){
 const sourceMonth = document.getElementById('copySourceMonth').value;
 if(!sourceMonth) return;

 if(sourceMonth === currentMonth()){
   alert('You cannot copy from the current month.');
   return;
 }

 const rows = await getElecMonthRows(sourceMonth);
 if(rows === null) return;

 if(rows.length === 0){
   alert('No tenant data found for ' + sourceMonth + '.');
   return;
 }

 const step = document.getElementById('copyStep2');
 step.innerHTML = `
   <h3 style="margin-top:0">Copy from ${escapeHtml(sourceMonth)}</h3>

   <div style="border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;margin-bottom:16px">
     <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
       <h3 style="margin:0">👤 TENANTS</h3>
       <label style="display:flex;align-items:center;gap:7px;width:auto">
         <input type="checkbox" id="copySelectAll" checked onchange="toggleAllCopyTenants(this.checked)" style="width:auto"> Select all
       </label>
     </div>
     <div style="display:grid;gap:8px;max-height:280px;overflow:auto">
       ${rows.map((row,index) => `
         <label style="display:flex;gap:10px;align-items:center;padding:9px;border-radius:8px;background:rgba(255,255,255,.04)">
           <input type="checkbox" class="copy-tenant" value="${index}" checked style="width:auto">
           <span>${escapeHtml(row.tenant_name || 'Unnamed Tenant')}</span>
         </label>
       `).join('')}
     </div>
   </div>

   <div style="border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;margin-bottom:16px">
     <h3 style="margin-top:0">FIELDS TO COPY</h3>
     <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
       <label><input type="checkbox" class="copy-field" value="name" checked style="width:auto"> TENANT NAME</label>
       <label><input type="checkbox" class="copy-field" value="previousFromCurrent" checked style="width:auto"> SOURCE CURRENT → NEW PREVIOUS</label>
       <label><input type="checkbox" class="copy-field" value="current" style="width:auto"> CURRENT kWh</label>
       <label><input type="checkbox" class="copy-field" value="price" checked style="width:auto"> PRICE / kWh</label>
       <label><input type="checkbox" class="copy-field" value="status" style="width:auto"> STATUS</label>
       <label><input type="checkbox" class="copy-field" value="proof" style="width:auto"> PROOF LINK</label>
     </div>
   </div>

   <div style="font-size:13px;opacity:.78;margin-bottom:16px;line-height:1.45">
     Existing tenants with the same name are updated only for the selected fields.
     New tenants are added to the current month. By default, the source month&apos;s Current kWh becomes the new month&apos;s Previous kWh, Current stays blank, Status stays Unpaid, and proof stays blank.
   </div>

   <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
     <button onclick="document.getElementById('copyStep2').style.display='none';document.getElementById('copyStep1').style.display='block'" style="background:#475569">BACK</button>
     <button onclick="closeCopyMonthModal()" style="background:#dc2626">CANCEL</button>
     <button onclick="performSelectiveTenantCopy()">COPY SELECTED</button>
   </div>
 `;

 step.dataset.sourceRows = JSON.stringify(rows);
 document.getElementById('copyStep1').style.display = 'none';
 step.style.display = 'block';
}

function toggleAllCopyTenants(checked){
 document.querySelectorAll('.copy-tenant').forEach(input => {
   input.checked = checked;
 });
}

async function performSelectiveTenantCopy(){
 const step = document.getElementById('copyStep2');
 const sourceMonth = document.getElementById('copySourceMonth').value;
 const sourceRows = JSON.parse(step.dataset.sourceRows || '[]');

 const selectedIndexes = Array.from(document.querySelectorAll('.copy-tenant:checked'))
   .map(input => Number(input.value));

 const selectedFields = Array.from(document.querySelectorAll('.copy-field:checked'))
   .map(input => input.value);

 if(selectedIndexes.length === 0){
   alert('Select at least one tenant.');
   return;
 }

 if(selectedFields.length === 0){
   alert('Select at least one field to copy.');
   return;
 }

 selectedIndexes.forEach(index => {
   const source = sourceRows[index];
   if(!source) return;

   const sourceName = String(source.tenant_name || '').trim();
   if(!sourceName) return;

   let targetRow = [...tenantBody.rows].find(row =>
     String(row.querySelector('.name')?.value || '').trim().toLowerCase() === sourceName.toLowerCase()
   );

   if(!targetRow){
     addTenantRow({
       name: sourceName,
       previous: 0,
       current: '',
       price: '',
       status: 'Unpaid',
       proof_url: ''
     });
     targetRow = tenantBody.rows[tenantBody.rows.length - 1];
   }

   const nameInput = targetRow.querySelector('.name');
   const prevInput = targetRow.querySelector('.prev');
   const currInput = targetRow.querySelector('.curr');
   const priceInput = targetRow.querySelector('.price');
   const statusSelect = targetRow.querySelector('.status');

   if(selectedFields.includes('name')){
     nameInput.value = sourceName;
   }

   if(selectedFields.includes('previousFromCurrent')){
     prevInput.value = source.current_kwh ?? 0;
   }

   if(selectedFields.includes('current')){
     currInput.value = source.current_kwh ?? '';
   }

   if(selectedFields.includes('price')){
     priceInput.value = source.price_per_kwh ?? '';
   }

   if(selectedFields.includes('status')){
     statusSelect.value = source.status || 'Unpaid';
     statusColor(statusSelect);
   }

   if(selectedFields.includes('proof')){
     targetRow.dataset.proofUrl = source.proof_url || '';
     const proofLink = targetRow.querySelector('.proofLink');
     proofLink.innerHTML = source.proof_url
       ? `<a href="${escapeHtml(source.proof_url)}" target="_blank" style="color:#93c5fd">View</a>`
       : '';
   }

   calc(currInput);
 });

 await saveMonth();
 await loadMonth();
 closeCopyMonthModal();
 alert(`Selected tenants copied from ${sourceMonth}.`);
}
async function saveMonth(){

 const month = currentMonth();

 const { error: deleteError } =
 await supabaseClient
   .from('elec_tenant_bills')
   .delete()
   .eq('month', month);

 if(deleteError){
   console.error(deleteError);
   alert(deleteError.message);
   return;
 }

const rows = [...tenantBody.rows].map((r,index) => ({
   month: month,
 display_order:index,
   tenant_name: r.querySelector('.name').value,
   previous_kwh: Number(r.querySelector('.prev').value || 0),
   current_kwh: Number(r.querySelector('.curr').value || 0),
   price_per_kwh: Number(r.querySelector('.price').value || 0),
   status: r.querySelector('.status').value,
  proof_url:r.dataset.proofUrl || ''
 }));

 console.log("Saving rows:", rows);

 if(rows.length){
   const { error } =
   await supabaseClient
     .from('elec_tenant_bills')
     .insert(rows);

   if(error){
     console.error(error);
     alert(error.message);
     return;
   }
 }

await loadDB();

console.log("DB after save:", db);
console.log("Saved to Supabase");}


async function loadMonth(){

 await loadDB();

 console.log("Loading month:", currentMonth());
 console.log("Month data:", db.months[currentMonth()]);

 ensureMonth(currentMonth());

 tenantBody.innerHTML='';

 let m=db.months[currentMonth()];

 console.log("Tenants found:", m.tenants);

m.tenants.forEach(addTenantRow);

filterTenants();}

function addTenant(){
  addTenantRow({
    id:'T'+Date.now(),
    previous:0,
    price:'',
    status:'Unpaid'
  });
}
function addTenantRow(t){
 let tr=document.createElement('tr');
 tr.dataset.id=t.id||('T'+Date.now()+Math.random());
 tr.innerHTML=`
 <td><input class="name" value="${t.name||''}" style="width:95%"></td>
 <td><input class="prev kwh-input" type="number" value="${t.previous||0}" oninput="calc(this)"></td>
 <td><input class="curr kwh-input" type="number" value="${t.current||''}" oninput="calc(this)"></td>
 <td class="cons">0</td>
 <td><input class="price kwh-input" type="number" value="${t.price ?? ''}" oninput="calc(this)"></td>
 <td class="total">₱0.00</td>
 <td><select class="status" style="width:90%" onchange="statusColor(this)"><option>Unpaid</option><option>Paid</option></select></td>
<td class="proof-cell">

  <input
    type="file"
    class="proofFile"
    accept="image/*"
    capture="environment"
    onchange="uploadProof(this)"
      style="max-width:100px"
  >

  <div class="proofLink">
    ${
      t.proof_url
      ? `<a href="${t.proof_url}" target="_blank" style="color:#93c5fd">View</a>`
      : ''
    }
  </div>
</td> <td><button onclick="this.closest('tr').remove()">Delete</button></td>`;
 tenantBody.appendChild(tr);
 tr.querySelector('.status').value=t.status||'Unpaid';
 statusColor(tr.querySelector('.status'));
 calc(tr.querySelector('.curr'));
}

function calc(el){
 let r=el.closest('tr');
 let p=+r.querySelector('.prev').value||0;
 let c=+r.querySelector('.curr').value||0;
let pr = Number(r.querySelector('.price').value || 0);
 let used=Math.max(0,c-p);
 r.querySelector('.cons').innerText=used;
 r.querySelector('.total').innerText='₱'+(used*pr).toFixed(2);
}

function statusColor(s){s.className='status '+(s.value==='Paid'?'paid':'unpaid');}
function filterTenants(){

  const search =
    document.getElementById('tenantSearch')
      .value
      .toLowerCase()
      .trim();

  [...tenantBody.rows].forEach(row => {

    const tenantName =
      row.querySelector('.name')
         .value
         .toLowerCase();

    row.style.display =
      tenantName.includes(search)
      ? ''
      : 'none';

  });

}
async function uploadProof(input){

 const file = input.files[0];

 if(!file) return;

 const fileName =
   Date.now() + "_" + file.name;

 const { error } =
 await supabaseClient.storage
   .from('tenant-signatures')
   .upload(fileName,file);

 if(error){
   alert(error.message);
   return;
 }

 const { data } =
 supabaseClient.storage
   .from('tenant-signatures')
   .getPublicUrl(fileName);

 const row = input.closest('tr');

 row.dataset.proofUrl =
   data.publicUrl;

 input.nextElementSibling.innerHTML =
   `<a href="${data.publicUrl}"
       target="_blank"
       style="color:#93c5fd">
       View
    </a>`;

 await saveMonth();
}


async function exportBackup(){
 await saveMonth();

 let blob=new Blob(
   [JSON.stringify(db,null,2)],
   {type:'application/json'}
 );

 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='tenant_tracker_v5_backup.json';
 a.click();
}

function importBackup(e){
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader();
 r.onload=()=>{db=JSON.parse(r.result);saveDB();loadMonth();alert('Imported');};
 r.readAsText(f);
}

async function prevMonth(){
 if(monthSelect.selectedIndex>0){
   await saveMonth();
   monthSelect.selectedIndex--;
  await loadMonth();
await saveCurrentMonthToSupabase(); }
}

async function nextMonth(){
 if(monthSelect.selectedIndex<monthSelect.options.length-1){
   await saveMonth();
   monthSelect.selectedIndex++;
  await loadMonth();
await saveCurrentMonthToSupabase(); }
}


</script>

</body>
</html>
