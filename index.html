<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>424 Systems</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 0%,#18365f 0,transparent 38%),radial-gradient(circle at 90% 90%,#392266 0,transparent 34%),#07111f;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(760px,100%);text-align:center}.brand{font-size:clamp(42px,9vw,72px);font-weight:900;letter-spacing:6px;margin:0}.sub{color:#aab6ca;margin:8px 0 34px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.app{display:block;text-decoration:none;color:#fff;padding:34px 24px;border-radius:22px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.065);box-shadow:0 18px 50px rgba(0,0,0,.22);transition:.2s transform,.2s border-color,.2s background}.app:hover,.app:focus-visible{transform:translateY(-4px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);outline:none}.icon{font-size:42px}.title{font-size:24px;font-weight:800;margin:12px 0 7px}.desc{font-size:14px;color:#aab6ca;line-height:1.45}.footer{margin-top:28px;color:#69778e;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.app{padding:26px 20px}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="brand">424</h1>
  <p class="sub">Select an application</p>
  <section class="grid" aria-label="Applications">
    <a class="app" href="electricity.html">
      <div class="icon">⚡</div>
      <div class="title">ELEC TRACKER</div>
      <div class="desc">Tenant electricity billing and usage tracking</div>
    </a>
    <a class="app" href="tindahan.html">
      <div class="icon">🛒</div>
      <div class="title">424 POS</div>
      <div class="desc">Sales, inventory, suppliers and customer ledger</div>
    </a>
  </section>
  <div class="footer">424 Systems</div>
</main>
</body>
</html>
